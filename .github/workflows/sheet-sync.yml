name: Sync in_progress from Google Sheet

on:
  repository_dispatch:
    types: [sheet-edit]
  schedule:
    - cron: "*/30 * * * *"   # fallback in case a dispatch is ever missed
  workflow_dispatch: {}       # manual "Run workflow" button, e.g. from the GitHub mobile app

permissions:
  contents: write

# never let two sync runs race each other on the push
concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install gspread google-auth google-api-python-client
      - name: Run sync
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/sync_sheet.py
      - name: Commit if changed
        # No [skip ci] in the message: pushes made with GITHUB_TOKEN never
        # retrigger Actions anyway, and Cloudflare honors [skip ci] by NOT
        # deploying — which would stop the site from ever updating.
        run: |
          git config user.name "sheet-sync-bot"
          git config user.email "actions@github.com"
          git add data.json
          [ -d assets/log ] && git add assets/log
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: in_progress from Sheet"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
