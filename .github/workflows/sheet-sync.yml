name: Sync in_progress from Google Sheet

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # manual "Run workflow" button when you don't want to wait

permissions:
  contents: write

# never let a manual run and a scheduled run race each other on the push
concurrency:
  group: sheet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install gspread google-auth
      - name: Run sync
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        # green no-op until the secrets are configured, instead of a red run
        # every 15 minutes from the cron
        run: |
          if [ -z "$GCP_SA_KEY" ] || [ -z "$SHEET_ID" ]; then
            echo "GCP_SA_KEY / SHEET_ID secrets not set yet — skipping sync"
            exit 0
          fi
          python scripts/sync_sheet.py
      - name: Commit if changed
        # No [skip ci] in the message: Cloudflare honors it by NOT deploying,
        # which would keep synced changes off the live site. Pushes made with
        # GITHUB_TOKEN don't retrigger Actions anyway.
        run: |
          git config user.name "sheet-sync-bot"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: in_progress from Sheet"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
